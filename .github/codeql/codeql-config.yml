name: "PeopleModeler CodeQL Config"

# Exclude generated files from CodeQL analysis.
# These are auto-generated by the Android build system (kapt stubs, databinding)
# and cannot be manually fixed — they are not part of the source code.
paths-ignore:
  - 'android/app/build/**'
  - 'android/app/build/tmp/kapt3/**'
  - 'android/app/build/generated/**'
  - '**/build/generated/**'
  - '**/build/tmp/**'
