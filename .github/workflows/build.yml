name: CI/CD PeopleModeler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PARALLEL SECURITY JOBS ────────────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  codeql-javascript:
    name: CodeQL — JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: javascript

  # ── PARALLEL TEST JOBS ────────────────────────────────
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Unit Tests
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./android/gradlew test -p android

  web-tests:
    name: Playwright Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        env:
          HOME: /root
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

  # ── SEQUENTIAL DEPLOYMENT JOBS ───────────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android-unit-tests, web-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Replace placeholders
        run: |
          sed -i 's/__GOOGLE_CLIENT_ID__/${{ secrets.GOOGLE_WEB_CLIENT_ID }}/g' web/js/gdrive.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    name: Build Android
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [scan-secrets, codeql-javascript, android-unit-tests, web-tests]
    runs-on: ubuntu-latest
    outputs:
      artifact-name: PeopleModeler-release-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android (APK & AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          PROPS
          cd android
          ./gradlew assembleRelease bundleRelease
      - name: Collect Android Artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/peoplemodeler-${{ github.run_number }}.apk \;
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} dist/peoplemodeler-${{ github.run_number }}.aab \;
      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: PeopleModeler-release-${{ github.run_number }}
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-android
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: PeopleModeler-release-${{ github.run_number }}
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "PeopleModeler build #${{ github.run_number }}"
          body: "Build #${{ github.run_number }} — Qualité validée."
          files: |
            dist/*.apk
            dist/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
