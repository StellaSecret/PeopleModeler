name: CI/CD PeopleModeler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SECURITY SCAN ─────────────────────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          # Pinned to 3.88.0 (no v prefix: GHCR tag): v3.96.0 (latest) has a Lob
          # detector regression that false-positives on 35-char test_* identifiers
          # (core/src/synergy.rs). Bump to latest once the upstream fix
          # (trufflehog PR #5188) is released.
          version: 3.88.0
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── SUPPLY CHAIN SCAN ─────────────────────────────────
  # Advisories (known CVEs / yanked crates), license compliance, and
  # dependency-source checks against deny.toml. Complements the secret
  # scan above: that catches leaked credentials, this catches
  # vulnerable or license-incompatible dependencies before they ship
  # in the WASM/Android builds.
  supply-chain:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ── RUST CORE ─────────────────────────────────────────
  rust-core:
    name: Rust Core (test + WASM check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
        working-directory: core
      - name: Check WASM build
        run: cargo check --target wasm32-unknown-unknown -p peoplemodeler-app

  # ── WEB (WASM) BUILD ──────────────────────────────────
  web-build:
    name: Build WASM
    needs: [rust-core, supply-chain]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      # dioxus 0.7.9 (dx) strips the linked wasm with `rust-objcopy --strip-all`
      # before running wasm-bindgen. Since the LLVM 23 bump (rustc 1.99),
      # --strip-all removes wasm custom sections, wiping wasm-bindgen's
      # metadata and failing dx build with "import of ... doesn't have an
      # adapter listed". Pin to an LLVM 22 toolchain so dx can build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        # azure.archive.ubuntu.com (the default mirror baked into the runner
        # image) has flaked with 502/proxy errors during installs. Retry the
        # update, then fall back to archive.ubuntu.com, which serves the same
        # package set.
        run: |
          for i in 1 2 3; do
            if apt update; then
              apt install -y build-essential
              exit 0
            fi
            sleep 5
          done
          sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
          done
          apt update
          apt install -y build-essential
      - name: Install Dioxus CLI
        run: |
          curl -sSLO https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 dx /usr/local/bin/dx
      # dx 0.7.9 falls back to its own bundled wasm-bindgen CLI when none is
      # on PATH, and that CLI is older than the crates in Cargo.lock. The
      # mismatch surfaces as `import of '__wbg_abort_*' doesn't have an
      # adapter listed` followed by a wasm-opt failure on a missing file, so
      # pin the CLI to whatever the lock says and fail loudly if the lock
      # drifts during resolution.
      # Kept POSIX sh: these jobs run with `shell: sh -e {0}`, which is dash on
      # the runner image, so `set -o pipefail` and other bashisms are fatal.
      # curl writes to a temp file first so a failed download cannot be masked
      # by tar exiting on empty input.
      - name: Match wasm-bindgen CLI to Cargo.lock
        run: |
          set -eu
          cargo fetch
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ -f Cargo.lock ]; then
            # Only check if tracked; avoid any command that could trigger --no-index
            if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
              if ! git diff --quiet -- Cargo.lock; then
                echo "::error::Cargo.lock drifted during resolution; pinned wasm-bindgen versions would no longer agree"
                git --no-pager diff --unified=0 -- Cargo.lock || true
                exit 1
              fi
              if ! git diff --cached --quiet -- Cargo.lock 2>/dev/null; then
                # index might not be used; ignore failure
                :
              fi
            fi
          fi
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          echo "Installing wasm-bindgen CLI ${version}"
          mkdir -p "${HOME}/.cargo/bin" "${HOME}/.local/share/.dx/tools/wasm-bindgen-${version}"
          archive=$(mktemp)
          curl -sSfL -o "${archive}" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "${archive}" -C "${HOME}/.cargo/bin" --strip-components=1
          tar -xzf "${archive}" -C "${HOME}/.local/share/.dx/tools/wasm-bindgen-${version}" --strip-components=1
          rm -f "${archive}"
          # Remove any other cached wasm-bindgen CLI versions dx might pick
          for d in "${HOME}/.local/share/.dx/tools"/wasm-bindgen-*; do
            [ -d "${d}" ] || continue
            case "${d}" in
              *"wasm-bindgen-${version}") ;;
              *) rm -rf "${d}" ;;
            esac
          done
          # Also clean wasm-pack cache and any other cached wasm-bindgen binaries
          rm -rf "${HOME}/.cache/.wasm-pack"/wasm-bindgen-* 2>/dev/null || true
          rm -rf "${HOME}/.local/share/.dx/tools"/wasm-bindgen-*-[0-9a-f]* 2>/dev/null || true
          # Ensure PATH has our binary first
          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          "${HOME}/.cargo/bin/wasm-bindgen" --version
          echo "WASM_BINDGEN=${HOME}/.cargo/bin/wasm-bindgen" >> "${GITHUB_ENV}"
      - name: Build WASM
        run: dx build --release --package peoplemodeler-app --debug-symbols false --base-path /PeopleModeler
      - name: Install npm deps
        env:
          HUSKY: 0
        run: npm ci
      - name: Upload WASM build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-public
          path: target/dx/peoplemodeler-app/release/web/public/
          retention-days: 1

  # ── PLAYWRIGHT E2E TESTS (SHARDED) ────────────────────
  playwright-tests:
    name: Playwright Tests (shard ${{ matrix.shard }}/2)
    needs: [web-build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Download WASM build
        uses: actions/download-artifact@v8
        with:
          name: wasm-public
          path: target/dx/peoplemodeler-app/release/web/public/
      - name: Install npm deps
        env:
          HUSKY: 0
        run: npm ci
      - name: Run e2e tests (shard ${{ matrix.shard }}/2)
        env:
          HOME: /root
          DOCKER_CONFIG: /tmp/.docker
        run: npx playwright test --reporter=list,html --shard=${{ matrix.shard }}/2
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # ── ANDROID BUILD (Dioxus Mobile) ────────────────────
  build-android:
    name: Build Android APK + AAB
    if: github.ref == 'refs/heads/main'
    needs: [scan-secrets, rust-core, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Cache Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Setup stable debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          DEST="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          SP="${KEYSTORE_PASSWORD:-android}"
          KP="${KEY_PASSWORD:-android}"
          ALIAS_RAW="${KEY_ALIAS}"
          ALIAS="${ALIAS_RAW:-androiddebugkey}"
          echo "--- Keystore setup: SP=$SP KP=$KP ALIAS=$ALIAS"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding base64 keystore (${#KEYSTORE_BASE64} chars)..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$DEST.tmp"
            SZ=$(stat -c%s "$DEST.tmp" 2>/dev/null || echo 0)
            echo "Decoded file size: $SZ bytes"
            # Try to read the keystore directly
            if keytool -list -v -keystore "$DEST.tmp" -storepass "$SP" -keypass "$KP" 2>/dev/null; then
              echo "Keystore is readable with SP/KP — copying directly"
              cp "$DEST.tmp" "$DEST"
            else
              echo "Direct read failed — trying JKS conversion"
              # Convert JKS → PKCS12 for apksigner compatibility
              keytool -importkeystore \
                -srckeystore "$DEST.tmp" \
                -destkeystore "$DEST" -deststoretype pkcs12 \
                -srcstorepass "$SP" -deststorepass "$SP" \
                -srcalias "$ALIAS" -destalias "$ALIAS" \
                -srckeypass "$KP" -destkeypass "$KP" 2>&1 || \
              { echo "WARNING: Keystore conversion failed, removing"; rm -f "$DEST"; }
            fi
            rm -f "$DEST.tmp"
          elif [ -f "$DEST" ]; then
            echo "Keystore restored from cache"
          else
            keytool -genkey -v -keystore "$DEST" \
              -alias "$ALIAS" -storepass "$SP" -keypass "$KP" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug keystore"
          fi
          if [ -f "$DEST" ]; then
            echo "--- Keystore verification ---"
            keytool -list -v -keystore "$DEST" -storetype pkcs12 -storepass "$SP" -keypass "$KP" \
              | grep -E "SHA1|Alias name:|Erweiterte|Extended|Eintragsart|Entry type:" || \
              echo "WARNING: Could not verify keystore fingerprint"
          fi
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy `tools` SDK package from the repo
          # index on 2026-09-14 (tracked upstream:
          # https://github.com/android-actions/setup-android/issues/537).
          # The action's default `packages` input is `tools platform-tools`,
          # so leaving it unset now fails every run with
          # "Warning: Failed to find package 'tools'" before any build step
          # runs. Nothing here actually needs the deprecated `tools`
          # package — `dx build --platform android` generates the Gradle
          # project, and Gradle itself resolves the platforms/build-tools
          # versions it needs — so pin to just `platform-tools`.
          packages: "platform-tools"
      - name: Install Dioxus CLI
        run: |
          curl -sSLO https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 dx /usr/local/bin/dx
      # Kept POSIX sh: these jobs run with `shell: sh -e {0}`, which is dash on
      # the runner image, so `set -o pipefail` and other bashisms are fatal.
      # curl writes to a temp file first so a failed download cannot be masked
      # by tar exiting on empty input.
      - name: Match wasm-bindgen CLI to Cargo.lock
        run: |
          set -eu
          cargo fetch
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ -f Cargo.lock ]; then
            # Only check if tracked; avoid any command that could trigger --no-index
            if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
              if ! git diff --quiet -- Cargo.lock; then
                echo "::error::Cargo.lock drifted during resolution; pinned wasm-bindgen versions would no longer agree"
                git --no-pager diff --unified=0 -- Cargo.lock || true
                exit 1
              fi
              if ! git diff --cached --quiet -- Cargo.lock 2>/dev/null; then
                # index might not be used; ignore failure
                :
              fi
            fi
          fi
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          echo "Installing wasm-bindgen CLI ${version}"
          mkdir -p "${HOME}/.cargo/bin" "${HOME}/.local/share/.dx/tools/wasm-bindgen-${version}"
          archive=$(mktemp)
          curl -sSfL -o "${archive}" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "${archive}" -C "${HOME}/.cargo/bin" --strip-components=1
          tar -xzf "${archive}" -C "${HOME}/.local/share/.dx/tools/wasm-bindgen-${version}" --strip-components=1
          rm -f "${archive}"
          # Remove any other cached wasm-bindgen CLI versions dx might pick
          for d in "${HOME}/.local/share/.dx/tools"/wasm-bindgen-*; do
            [ -d "${d}" ] || continue
            case "${d}" in
              *"wasm-bindgen-${version}") ;;
              *) rm -rf "${d}" ;;
            esac
          done
          # Also clean wasm-pack cache and any other cached wasm-bindgen binaries
          rm -rf "${HOME}/.cache/.wasm-pack"/wasm-bindgen-* 2>/dev/null || true
          rm -rf "${HOME}/.local/share/.dx/tools"/wasm-bindgen-*-[0-9a-f]* 2>/dev/null || true
          # Ensure PATH has our binary first
          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          "${HOME}/.cargo/bin/wasm-bindgen" --version
          echo "WASM_BINDGEN=${HOME}/.cargo/bin/wasm-bindgen" >> "${GITHUB_ENV}"
      - name: Clean stale artifacts
        run: cargo clean -p peoplemodeler-app
      - name: Build Android APK (aarch64) — first pass (generates project)
        run: dx build --release --platform android --package peoplemodeler-app --target aarch64-linux-android
      - name: Remove first-pass APK (no overlays)
        run: find target/dx -name "*.apk" -delete 2>/dev/null || true
      - name: Overlay custom Android resources (icons, themes, OAuth strings)
        run: |
          RES_DIR=$(find target/dx -type d -path "*/app/src/main/res" 2>/dev/null | head -1)
          if [ -n "$RES_DIR" ] && [ -d "app/res" ]; then
            echo "Overlaying app/res → $RES_DIR"
            # Remove Dioxus default icons (.webp) to avoid duplicate resource conflict with our .png
            find "$RES_DIR" -name "ic_launcher*.webp" -delete
            cp -r app/res/* "$RES_DIR/"
            # Inject default_web_client_id for Google Sign-In
            if [ -f "$RES_DIR/values/strings.xml" ]; then
              sed -i "s|__GOOGLE_CLIENT_ID__|$GOOGLE_CLIENT_ID|g" "$RES_DIR/values/strings.xml"
              echo "Injected GOOGLE_CLIENT_ID into strings.xml"
            fi
          else
            echo "WARNING: RES_DIR=$RES_DIR, app/res exists=$([ -d app/res ] && echo yes || echo no)"
          fi
      - name: Overlay native Google Sign-In (Kotlin + JNI)
        run: |
          KOTLIN_DIR=$(find target/dx -type d -path "*/app/src/main/kotlin" 2>/dev/null | head -1)
          if [ -n "$KOTLIN_DIR" ]; then
            OVERLAY="android/overlay"
            echo "Overlaying Kotlin code → $KOTLIN_DIR"
            cp -r "$OVERLAY/app/src/main/java/"* "$KOTLIN_DIR/"
            # Remove any duplicate MainActivity from other source dirs to avoid redeclaration
            find "$KOTLIN_DIR/.." -name "MainActivity.kt" ! -path "$KOTLIN_DIR/*" -delete
            # Copy ProGuard keep rules (GoogleDriveHelper methods called only via JNI)
            APP_DIR=$(dirname "$KOTLIN_DIR" | xargs dirname | xargs dirname)
            if [ -f "$OVERLAY/app/proguard-rules.pro" ]; then
              cp "$OVERLAY/app/proguard-rules.pro" "$APP_DIR/"
              echo "Copied proguard-rules.pro for GoogleDriveHelper keep rule"
            fi
          else
            echo "WARNING: Android kotlin source dir not found"
          fi
      - name: Overlay Gradle config (AGP 9, drop material)
        run: |
          GRADLE_DIR=$(find target/dx -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$GRADLE_DIR" ]; then
            OVERLAY="android/overlay"
            if [ -f "$OVERLAY/build.gradle.kts" ] && [ -f "$OVERLAY/app/build.gradle.kts" ]; then
              cp "$OVERLAY/build.gradle.kts" "$GRADLE_DIR/build.gradle.kts"
              cp "$OVERLAY/app/build.gradle.kts" "$GRADLE_DIR/app/build.gradle.kts"
              cp "$OVERLAY/gradle.properties" "$GRADLE_DIR/gradle.properties"
              MANIFEST=$(find "$GRADLE_DIR" -path "*/src/main/AndroidManifest.xml" 2>/dev/null | head -1)
              if [ -n "$MANIFEST" ]; then
                sed -i 's/ android:extractNativeLibs="true"//' "$MANIFEST"
                echo "Stripped android:extractNativeLibs from $MANIFEST"
              fi
              echo "Overlaid AGP 9 Gradle config (material removed, play-services-auth baked in)"
            else
              echo "WARNING: Overlay gradle files missing"
            fi
          else
            echo "WARNING: gradlew dir not found — skipping Gradle overlay"
          fi
      - name: Rebuild APK with custom resources
        run: |
          GRADLE_DIR=$(find target/dx -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR" && chmod +x gradlew && ./gradlew assembleRelease
          else
            echo "WARNING: gradlew not found"
          fi
      - name: Build Android AAB (bundle)
        run: |
          GRADLE_DIR=$(find target/dx/peoplemodeler-app/release/android -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$GRADLE_DIR" ]; then
            echo "Running bundleRelease in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            VCODE=$((100 + ${{ github.run_number }}))
            BG=$(find . -name "build.gradle*" -path "*/app/*" 2>/dev/null | head -1)
            if [ -n "$BG" ]; then
              echo "Injecting versionCode=$VCODE into $BG"
              sed -i "s/versionCode = [0-9]*/versionCode = $VCODE/" "$BG"
            fi
            chmod +x gradlew && ./gradlew bundleRelease
          else
            echo "WARNING: gradlew not found under target/dx/peoplemodeler-app/release/android"
            find target/dx -name "gradlew" 2>/dev/null || true
          fi
      - name: Upload R8 mapping for Play warning triage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: |
            target/dx/**/app/build/outputs/mapping/release/*.txt
            target/dx/**/app/build/outputs/**/output-metadata.json
          retention-days: 7
      - name: Sign APK (sign unsigned release APK if present)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=$(find target/dx -name "app-release-unsigned.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No unsigned APK found — debug APK already signed by SDK"
            exit 0
          fi
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore not found"
            exit 1
          fi
          SP="${KEYSTORE_PASSWORD:-android}"
          KP="${KEY_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"
          SIGNED="${APK%.apk}-signed.apk"
          ALIGNED="${APK%.apk}-aligned.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)
          "${BUILD_TOOLS}/zipalign" -p 4 "$APK" "$ALIGNED"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass "pass:$SP" \
            --key-pass "pass:$KP" --ks-key-alias "$ALIAS" \
            --out "$SIGNED" "$ALIGNED"
          echo "Signed: $SIGNED"
      - name: Sign AAB (required by Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(find target/dx -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "No AAB found — skipping"
            exit 0
          fi
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore not found"
            exit 1
          fi
          SP="${KEYSTORE_PASSWORD:-android}"
          KP="${KEY_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass "pass:$SP" \
            --key-pass "pass:$KP" --ks-key-alias "$ALIAS" \
            --min-sdk-version 21 \
            "$AAB"
          echo "Signed AAB: $AAB"
      - name: Collect APK and AAB
        run: |
          mkdir -p dist
          APK=$(find target/dx -name "*-signed.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find target/dx -name "*.apk" 2>/dev/null | head -1)
          fi
          AAB=$(find target/dx -name "*.aab" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" dist/peoplemodeler.apk
            echo "APK copied from: $APK"
          fi
          if [ -n "$AAB" ]; then
            cp "$AAB" dist/peoplemodeler.aab
            echo "AAB copied from: $AAB"
          fi
          if [ -z "$APK" ] && [ -z "$AAB" ]; then
            echo "WARNING: No APK or AAB found. Listing target/dx tree..."
            find target/dx -name "*.apk" -o -name "*.aab" 2>/dev/null || true
          fi
      - name: Package native debug symbols
        run: |
          mkdir -p dist/symbols/arm64-v8a
          SO="target/aarch64-linux-android/release/libpeoplemodeler_app.so"
          if [ -f "$SO" ]; then
            cp "$SO" dist/symbols/arm64-v8a/
            cd dist && zip -r symbols.zip symbols/ && rm -rf symbols/
            echo "Created symbols.zip ($(stat -c%s symbols.zip) bytes)"
          else
            echo "WARNING: $SO not found — skipping debug symbols"
          fi
      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/
          retention-days: 7

  # ── DEPLOY WEB TO GITHUB PAGES ────────────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Download WASM build
        uses: actions/download-artifact@v8
        with:
          name: wasm-public
          path: ./wasm-dist/
      - name: Merge WASM build with static pages
        run: |
          cp -r wasm-dist/* public/
          rm -rf wasm-dist
      - name: Add SPA fallback, landing page, and cache-control for GitHub Pages
        run: |
          if [ -f public/index.html ]; then
            # Safety: ensure any absolute asset references use subpath
            find public/ -type f \( -name '*.html' -o -name '*.js' \) \
              -exec sed -i 's|/\./assets/|/PeopleModeler/assets/|g' {} +
            # Rename Dioxus SPA so root serves landing page
            mv public/index.html public/spa.html
            # Inject URL cleanup into spa.html: strips /spa.html from path so Dioxus router sees correct route
            sed -i 's|<head>|<head><script>if(location.pathname.includes("/spa.html"))history.replaceState({},"",location.pathname.replace("/spa.html",""));</script>|' public/spa.html
            # Promote landing page to root index.html
            if [ -f public/landing.html ]; then
              # Fix landing page links: href="./" -> href="./spa.html"
              sed -i 's|href="\./"|href="./spa.html"|g' public/landing.html
              cp public/landing.html public/index.html
            fi
            # SPA fallback for deep-link refresh
            cp public/spa.html public/404.html
          fi
          # Cache headers: HTML fresh always, JS/WASM immutable (hashed names)
          cat > public/_headers << 'EOF'
          /*.html
            Cache-Control: no-cache
          /PeopleModeler/assets/*.js
            Cache-Control: public, max-age=31536000, immutable
          /PeopleModeler/assets/*.wasm
            Cache-Control: public, max-age=31536000, immutable
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # ── RELEASE (Android + Web) ──────────────────────────
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [playwright-tests, build-android]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-apk
          path: dist/
      - name: List downloaded files
        run: ls -la dist/ 2>/dev/null || echo "dist/ empty"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "PeopleModeler build #${{ github.run_number }}"
          body: "Build #${{ github.run_number }} — Dioxus Rust app."
          files: |
            dist/*.apk
            dist/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
