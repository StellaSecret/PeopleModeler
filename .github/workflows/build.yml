name: CI/CD PeopleModeler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PARALLEL SECURITY JOBS ────────────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL (Java)
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: autobuild
      - name: Initialize CodeQL (JavaScript)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none
      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  # ── PARALLEL TEST JOBS ────────────────────────────────
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Unit Tests
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./android/gradlew test -p android

  web-tests:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npx playwright test --project=chromium --project=firefox

  # ── SEQUENTIAL DEPLOYMENT JOBS ───────────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android-unit-tests, web-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    name: Build Android
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [scan-secrets, codeql-analysis, android-unit-tests, web-tests]
    runs-on: ubuntu-latest
    outputs:
      artifact-name: PeopleModeler-release-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android (APK & AAB)
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          cd android
          ./gradlew assembleRelease bundleRelease
      - name: Collect Android Artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/peoplemodeler-${{ github.run_number }}.apk \;
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} dist/peoplemodeler-${{ github.run_number }}.aab \;
      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: PeopleModeler-release-${{ github.run_number }}
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-android
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: PeopleModeler-release-${{ github.run_number }}
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "PeopleModeler build #${{ github.run_number }}"
          body: "Build #${{ github.run_number }} — Qualité validée."
          files: |
            dist/*.apk
            dist/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
