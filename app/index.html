<!DOCTYPE html>
<html lang="en">
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta charset="UTF-8">
    </head>
    <body>
        <div id="main"></div>
        <script>
            (function () {
                var done = false;
                function set(h) { if (h > 0) { document.documentElement.style.setProperty("--top-bar-h", h + "px"); } }
                function measure() {
                    var bar = document.querySelector(".top-bar");
                    if (!bar || done) { return; }
                    done = true;
                    set(bar.offsetHeight);
                    if (window.ResizeObserver) { new ResizeObserver(function () { set(bar.offsetHeight); }).observe(bar); }
                }
                setInterval(measure, 200);
                window.addEventListener("resize", measure);
                if (document.readyState !== "loading") { measure(); } else { document.addEventListener("DOMContentLoaded", measure); }
            })();
        </script>
    </body>
</html>
