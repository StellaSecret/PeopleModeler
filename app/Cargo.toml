[package]
name = "peoplemodeler-app"
version = "1.37.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
dioxus = { version = "0.7", features = ["web", "router", "asset"] }
peoplemodeler-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
web-sys = { version = "0.3", features = ["Window", "Blob", "Url", "FileReader", "FileList", "HtmlInputElement", "Location", "Document", "Element", "HtmlElement", "HtmlScriptElement", "Node", "Navigator", "Clipboard", "MediaQueryList", "Storage", "ServiceWorkerContainer", "ServiceWorkerRegistration"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
webbrowser = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-storage = "0.3"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.10"
